[build]
  publish = "."
  command = ""

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  directory = "netlify/functions"
  included_files = ["emails/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-src 'none'; object-src 'none'; base-uri 'self';"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/pages.css"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/site-config.js"
  [headers.values]
    Cache-Control = "public, max-age=120, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/services/"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/services/landscape-design"
  to = "/services/landscape-design.html"
  status = 200

[[redirects]]
  from = "/services/hardscaping"
  to = "/services/hardscaping.html"
  status = 200

[[redirects]]
  from = "/services/outdoor-kitchens"
  to = "/services/outdoor-kitchens.html"
  status = 200

[[redirects]]
  from = "/services/fire-features"
  to = "/services/fire-features.html"
  status = 200

[[redirects]]
  from = "/services/artificial-turf"
  to = "/services/artificial-turf.html"
  status = 200

[[redirects]]
  from = "/services/irrigation"
  to = "/services/irrigation.html"
  status = 200

[[redirects]]
  from = "/scottsdale-landscaping"
  to = "/scottsdale-landscaping.html"
  status = 200

[[redirects]]
  from = "/phoenix-landscaping"
  to = "/phoenix-landscaping.html"
  status = 200

[[redirects]]
  from = "/search"
  to = "/search.html"
  status = 200

[[redirects]]
  from = "/best-landscaper-scottsdale"
  to = "/best-landscaper-scottsdale.html"
  status = 200

[[redirects]]
  from = "/project-planning-checklist"
  to = "/project-planning-checklist.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
