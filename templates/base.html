<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Language Quest</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="branding">Language Quest</div>
    <nav>
      <a href="{{ url_for('home') }}">Home</a>
      {% if user %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('practice') }}">Practice</a>
        <form class="inline-form" action="{{ url_for('logout') }}" method="get">
          <button type="submit">Logout</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Built with Flask for a Duolingo-inspired experience.</footer>
</body>
</html>
