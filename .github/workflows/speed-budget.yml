name: Speed Budget

on:
  pull_request:
  push:
    branches:
      - main
      - claude/landscaping-company-website-hl2cg

jobs:
  speed-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run speed budget check
        run: node scripts/check-speed-budget.js
